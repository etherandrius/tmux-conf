
unbind-key g
unbind-key C-g
set -g prefix C-g
bind-key C-g last-window
set -g allow-passthrough on

# Sat Nov  9 04:03:59 PM GMT 2024
# rename window to current folder name
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# Rename window via fzf popup on <prefix> a (pick a suggestion or type a custom name).
# display-popup doesn't expand #{...}, so stash context via `set -gF` first.
bind-key a set -gF @rn_win "#{window_id}" \; set -gF @rn_path "#{pane_current_path}" \; \
  set -gF @rn_cmd "#{pane_current_command}" \; set -gF @rn_sess "#{session_name}" \; \
  set -gF @rn_pane "#{pane_id}" \; \
  display-popup -E -w 50% -h 40% "~/.config/tmux/tmux-rename-window.sh"

# Use ; for command mode
unbind-key :
bind-key \; command-prompt

# Act like vim
set-window-option -g mode-keys vi
# Navigate between panes with Leader-hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# Copy like vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe 'xclip -in -selection clipboard'

set -g mouse on

# Pane management
set -g pane-border-style 'fg=grey'
set -g pane-active-border-style 'fg=yellow,bold'
set -g pane-border-status off
set -g pane-border-format ' #{pane_index} | #{pane_current_command} | #{b:pane_current_path} '
bind % split-window -h -c "#{pane_current_path}"
set-option -g command-alias[10] join-pane='join-pane -h'
bind \" split-window -v -c "#{pane_current_path}"

# Marked pane: mark with <prefix> m, toggle to/from it with <prefix> `
# (jumps to the marked pane from anywhere; press again in it to jump back)
bind \` if -F '#{pane_marked}' {
  run-shell 'tmux switch-client -t "$(tmux show -gv @jumpback)"'
} {
  set -gF @jumpback "#{pane_id}"
  switch-client -t'{marked}'
}

# Hide pane border when only one pane is in the window
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'

# Session/window switchers: fuzzy replacements for the default choose-tree UI.
# <prefix> s selects a session; <prefix> w selects a window across all sessions.
bind s display-popup -E -w 100% -h 100% -T ' sessions ' \
  "~/.config/tmux/tmux-switcher.sh sessions"
bind w display-popup -E -w 100% -h 100% -T ' windows ' \
  "~/.config/tmux/tmux-switcher.sh windows"

# Window management
# Move current window to another (or new) session via fzf popup.
# Overrides the default `.` (move-window index prompt). Type to filter existing
# sessions, or type a new name to create one; handles the last-window case.
# display-popup doesn't expand #{...}, so stash the source via `set -gF` first.
bind . set -gF @mw_src_win "#{window_id}" \; set -gF @mw_src_sess "#{session_name}" \; \
  display-popup -E -w 50% -h 40% "~/.config/tmux/tmux-move-window.sh"
# If I want to source current path
bind c new-window -a -c "#{pane_current_path}"
# Open scrollback buffer in nvim for easy copying
bind ] run-shell "tmux capture-pane -p -S - > /tmp/tmux-stdout-#{pane_id}.txt && tmux new-window -a -n '>stdout' 'nvim /tmp/tmux-stdout-#{pane_id}.txt'"
# bind c new-window -a

# Status bar
set-option -g status-style nobold,bg=default,fg=default,reverse
set-window-option -g window-status-current-style bold,noreverse,fg=default,bg=default
set -g status-left "#{?client_prefix,#[fg=blue]| #S |#[fg=default],#{?pane_in_mode,#[fg=magenta]| #S |#[fg=default],| #S |}}#[fg=default]"
set -g status-left-length 30
set -g status-right-length 30
set -g status-right "#{?client_prefix, #[fg=blue]| CTRL-G |#[fg=default], #{?pane_in_mode,#[fg=magenta]| VISUAL |#[fg=default],|        |}}"
set -g message-style reverse,bg=default,fg=default

# List of plugins
# After adding a plugin run [PREFIX]-I to install them
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# extended-keys corrupts newlines in pasted content (converts \n to CSI-u sequences)
# use kitty map shift+enter instead (see ~/.config/kitty/kitty.conf)
