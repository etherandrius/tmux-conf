
unbind-key g
unbind-key C-g
set -g prefix C-g
bind-key C-g last-window
set -g allow-passthrough on

# Sat Nov  9 04:03:59 PM GMT 2024
# rename window to current folder name
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# Rename window mini-menu on <prefix> a
bind-key a run-shell "tmux set -g @git_branch \"$(git -C '#{pane_current_path}' rev-parse --abbrev-ref HEAD 2>/dev/null)\"" \; \
  display-menu -T "#[align=centre]Rename Window" -x C -y C \
  "#{b:pane_current_path}"                            "" { set-option -w automatic-rename off ; rename-window "#{b:pane_current_path}" } \
  "#{pane_current_command}"                           "" { set-option -w automatic-rename off ; rename-window "#{pane_current_command}" } \
  "#{pane_current_command}-#{b:pane_current_path}"  "" { set-option -w automatic-rename off ; rename-window "#{pane_current_command}-#{b:pane_current_path}" } \
  "#{session_name}"                                  "" { set-option -w automatic-rename off ; rename-window "#{session_name}" } \
  "#{pane_id}"                                      "" { set-option -w automatic-rename off ; rename-window "#{pane_id}" } \
  "#{pane_current_path}"                              "" { set-option -w automatic-rename off ; rename-window "#{pane_current_path}" } \
  "#{@git_branch}"                                   "" { set-option -w automatic-rename off ; rename-window "#{@git_branch}" } \
  "#{pane_current_command}-#{@git_branch}"           "" { set-option -w automatic-rename off ; rename-window "#{pane_current_command}-#{@git_branch}" }

# Use ; for command mode
unbind-key :
bind-key \; command-prompt

# Act like vim
set-window-option -g mode-keys vi
# Navigate between panes with Leader-hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# Copy like vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe 'xclip -in -selection clipboard'

set -g mouse on

# Pane management
set -g pane-border-style 'fg=grey'
set -g pane-active-border-style 'fg=green'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} | #{pane_current_command} | #{b:pane_current_path} '
bind % split-window -h -c "#{pane_current_path}"
set-option -g command-alias[10] join-pane='join-pane -h'
bind \" split-window -v -c "#{pane_current_path}"

# Window management
# If I want to source current path
bind c new-window -a -c "#{pane_current_path}"
# Open scrollback buffer in nvim for easy copying
bind ] run-shell "tmux capture-pane -p -S - > /tmp/tmux-stdout-#{pane_id}.txt && tmux new-window -a -n '>stdout' 'nvim /tmp/tmux-stdout-#{pane_id}.txt'"
# bind c new-window -a

# Status bar
set-option -g status-style nobold,bg=default,fg=default,reverse
set-window-option -g window-status-current-style bold,noreverse,fg=default,bg=default
set -g status-left "#{?client_prefix,#[fg=blue]| #S |#[fg=default],#{?pane_in_mode,#[fg=magenta]| #S |#[fg=default],| #S |}}#[fg=default]"
set -g status-left-length 30
set -g status-right-length 30
set -g status-right "#{?client_prefix, #[fg=blue]| CTRL-G |#[fg=default], #{?pane_in_mode,#[fg=magenta]| VISUAL |#[fg=default],|        |}}"
set -g message-style reverse,bg=default,fg=default

# List of plugins
# After adding a plugin run [PREFIX]-I to install them
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# extended-keys corrupts newlines in pasted content (converts \n to CSI-u sequences)
# use kitty map shift+enter instead (see ~/.config/kitty/kitty.conf)
